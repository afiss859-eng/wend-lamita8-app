name: Build Wend-Lamita APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire Wend-Lamita
        run: npm run build

      - name: Installer Capacitor Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compiler APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Wend-Lamita-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
